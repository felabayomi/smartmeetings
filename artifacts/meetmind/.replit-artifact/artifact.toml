kind = "web"
previewPath = "/"
title = "MeetMind - Smart Meeting Calendar"
version = "1.0.0"
id = "artifacts/meetmind"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21865
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/meetmind run dev"

[services.env]
PORT = "21865"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/meetmind", "run", "build"]
publicDir = "artifacts/meetmind/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
